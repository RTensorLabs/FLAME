[package]
name = "flame-wasm"
version.workspace = true
edition.workspace = true
description = "FLAME text generation compiled to WebAssembly, for the in-browser demo"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flame = { path = "../flame" }
candle-core.workspace = true
candle-nn.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
rand.workspace = true
wasm-bindgen = "0.2.130"
console_error_panic_hook = "0.1.7"

# rand needs a randomness source on wasm32; the matching `--cfg getrandom_backend` flag is in
# .cargo/config.toml. FLAME itself always seeds its RNGs explicitly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
