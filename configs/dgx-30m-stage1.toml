# Stage 1 of 2 — general pre-training of the 30M Rust + English base model.
# Learns Rust code and English together (one mixed run, so neither is forgotten).
# 7500 steps × 2×64×1024 = 0.98 B tokens (75% of the total budget).
# Both stages together: ≈ 13–50 h on an RTX 3070 Ti laptop (≈ 25 h at 3 TFLOP/s) → 2–8 weeks at 6 h/week.
# Next: rust-30m-stage2.toml starts from this run's final weights.
# Pausable (Ctrl+C / --max-minutes / PAUSE); see docs/end-to-end-guide.md.

[model]
d_model = 512
n_layers = 8
n_heads = 8
max_seq_len = 1024

[train]
micro_batch_size = 8
grad_accum_steps = 16
seq_len = 1024
max_steps = 7500
lr = 0.0006
min_lr = 6e-05
warmup_steps = 300
eval_every = 500
eval_batches = 40
log_every = 1
sample_every = 1000
checkpoint_every_minutes = 5

[data]
tokenizer = "data/tokenizers/rust-en-8k.json"
sources = [
  { name = "rust-code", dir = "data/rust-code", weight = 0.59 },
  { name = "english",   dir = "data/english",   weight = 0.35 },
  { name = "rust-docs", dir = "data/rust-docs", weight = 0.06 },
]
