# Phase 4: ~30 M parameter Rust-oriented base model (8192-token BPE trained on Rust code).
# 20 000 steps × 128 × 512 tokens ≈ 1.3 B tokens.
# Estimate on an RTX 3070 Ti laptop: ≈ 35–70 h of training → 6–12 weeks at 6 h/week.
# Everything is pausable; see docs/pause-and-resume.md.

[model]
d_model = 512
n_layers = 8
n_heads = 8
max_seq_len = 512

[train]
micro_batch_size = 16
grad_accum_steps = 8
seq_len = 512
max_steps = 20000
lr = 6e-4
min_lr = 6e-5
warmup_steps = 500
eval_every = 1000
eval_batches = 40
log_every = 50
sample_every = 2000
checkpoint_every_minutes = 10

[data]
tokenizer = "data/tokenizers/rust-8k.json"
dataset_dir = "data/rust"
