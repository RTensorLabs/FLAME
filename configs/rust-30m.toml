# Phase 4: ~30 M parameter Rust-oriented base model (8192-token BPE trained on Rust code).
# It is also the base model that Lintless fine-tunes (see the lintless repo).
#
# Context 1024: long enough for a compiler error + code window + fix (Lintless), and the
# largest that trains comfortably in 8 GB with FLAME's current (non-fused) attention.
# 20 000 steps × (2 × 64) × 1024 tokens ≈ 2.6 B tokens would be ideal; this config uses
# 10 000 steps ≈ 1.3 B tokens (~44 tokens/param).
# Estimate on an RTX 3070 Ti laptop: ≈ 13–50 h (≈ 25 h at 3 TFLOP/s) → 2–8 weeks at 6 h/week.
# Everything is pausable; see docs/pause-and-resume.md.

[model]
d_model = 512
n_layers = 8
n_heads = 8
max_seq_len = 1024

[train]
micro_batch_size = 2
grad_accum_steps = 64
seq_len = 1024
max_steps = 10000
lr = 6e-4
min_lr = 6e-5
warmup_steps = 300
eval_every = 500
eval_batches = 40
log_every = 20
sample_every = 1000
checkpoint_every_minutes = 10

[data]
tokenizer = "data/tokenizers/rust-8k.json"
dataset_dir = "data/rust"
