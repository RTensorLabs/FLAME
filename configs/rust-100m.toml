# ONLY IF the 30 M model is not good enough (see docs/end-to-end-guide.md, "Deciding to scale up").
# ~91 M parameters, same tokenizer and context as rust-30m, so Lintless data can be reused.
# 15 000 steps × (1 × 128) × 1024 tokens ≈ 2 B tokens (~22 tokens/param).
# Estimate on an RTX 3070 Ti laptop: ≈ 60–230 h with FLAME as it is today (FP32),
# ≈ 22–35 h after the planned speed work (TF32/bf16 + fused attention). Do the speed work first.
# micro-batch 1 × accumulation 128: at d_model 768 / 12 layers, attention activations for one
# 1024-token sequence are ≈ 3 GB; a micro-batch of 2 would not fit in 8 GB.

[model]
d_model = 768
n_layers = 12
n_heads = 12
max_seq_len = 1024

[train]
micro_batch_size = 1
grad_accum_steps = 128
seq_len = 1024
max_steps = 15000
lr = 4e-4
min_lr = 4e-5
warmup_steps = 500
eval_every = 500
eval_batches = 40
log_every = 20
sample_every = 1000
checkpoint_every_minutes = 10

[data]
tokenizer = "data/tokenizers/rust-8k.json"
dataset_dir = "data/rust"
