# Stage 1 of 2 — general pre-training of the 100M Rust + English base model.
# Learns Rust code and English together (one mixed run, so neither is forgotten).
# 11250 steps × 1×128×1024 = 1.47 B tokens (75% of the total budget).
# ONLY if the 30 M Lintless is not good enough, and after the planned FLAME speed work. Both stages: ≈ 60–230 h today, ≈ 22–35 h after the speed work. micro-batch 1: at d_model 768 a micro-batch of 2 does not fit in 8 GB.
# Next: rust-100m-stage2.toml starts from this run's final weights.
# Pausable (Ctrl+C / --max-minutes / PAUSE); see docs/end-to-end-guide.md.

[model]
d_model = 768
n_layers = 12
n_heads = 12
max_seq_len = 1024

[train]
micro_batch_size = 1
grad_accum_steps = 128
seq_len = 1024
max_steps = 11250
lr = 0.0004
min_lr = 4e-05
warmup_steps = 300
eval_every = 500
eval_batches = 40
log_every = 20
sample_every = 1000
checkpoint_every_minutes = 10

[data]
tokenizer = "data/tokenizers/rust-en-8k.json"
sources = [
  { name = "rust-code", dir = "data/rust-code", weight = 0.59 },
  { name = "english",   dir = "data/english",   weight = 0.35 },
  { name = "rust-docs", dir = "data/rust-docs", weight = 0.06 },
]
