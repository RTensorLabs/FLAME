[workspace]
resolver = "2"
members = ["crates/flame", "crates/flame-cli", "crates/flame-wasm"]
# `cargo build` / `cargo test` skip the browser crate; build it with deploy/web/build.sh.
default-members = ["crates/flame", "crates/flame-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"

[workspace.dependencies]
candle-core = "0.11"
candle-nn = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rayon = "1"
memmap2 = "0.9"
ctrlc = { version = "3", features = ["termination"] }
walkdir = "2"

[profile.release]
debug = false
codegen-units = 16

# Tests do real tensor math; unoptimised builds are painfully slow.
[profile.test]
opt-level = 2
